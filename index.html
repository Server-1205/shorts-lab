<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-start: #0a0e17;
        --bg-end: #121829;
        --primary: #6366f1;
        --accent: #ec4899;
        --cyan: #06b6d4;
        --ink: #ffffff;
        --muted: #94a3b8;
        --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
        font-family: var(--font);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px 60px;
      }
      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .badge-wrap {
        margin-bottom: 48px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 18px 36px;
        border-radius: 9999px;
        background: rgba(99, 102, 241, 0.15);
        border: 2px solid rgba(99, 102, 241, 0.4);
        color: #c7d2fe;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .badge-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 16px #22c55e;
      }
      .headline {
        color: var(--ink);
        font-size: 92px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.04em;
        text-align: center;
        max-width: 920px;
        margin-bottom: 32px;
      }
      .gradient-text {
        background: linear-gradient(135deg, #818cf8 0%, #ec4899 50%, #06b6d4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .subline {
        color: var(--muted);
        font-size: 40px;
        font-weight: 500;
        text-align: center;
        line-height: 1.4;
        max-width: 820px;
        margin-bottom: 64px;
      }
      .tags {
        display: flex;
        gap: 20px;
        justify-content: center;
      }
      .tag {
        padding: 16px 32px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #e2e8f0;
        font-size: 32px;
        font-weight: 600;
      }
      .progress-container {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 14px;
        background: rgba(255, 255, 255, 0.08);
      }
      .progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, var(--primary), var(--accent), var(--cyan));
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1920"
    >
      <!-- Audio Tracks -->
      <audio
        id="track-bgm"
        class="clip"
        data-start="0"
        data-duration="4"
        data-volume="0.6"
        src="assets/audio/bgm.wav"
      ></audio>

      <audio
        id="track-whoosh"
        class="clip"
        data-start="0"
        data-duration="1.5"
        data-volume="0.5"
        src="assets/audio/whoosh-cinematic.mp3"
      ></audio>

      <audio
        id="track-chime"
        class="clip"
        data-start="0.9"
        data-duration="1.5"
        data-volume="0.4"
        src="assets/audio/chime.mp3"
      ></audio>

      <audio
        id="track-impact"
        class="clip"
        data-start="2.0"
        data-duration="2.0"
        data-volume="0.5"
        src="assets/audio/impact-bass-1.mp3"
      ></audio>

      <!-- Visual Elements -->
      <div class="clip scene" data-start="0" data-duration="4" data-track-index="0">
        <div id="badge" class="badge-wrap">
          <div class="badge">
            <span class="badge-dot"></span>
            HyperFrames • Shorts Lab
          </div>
        </div>

        <h1 id="title" class="headline">
          Deterministic<br />
          <span class="gradient-text">YouTube Shorts</span><br />
          from Code
        </h1>

        <p id="desc" class="subline">
          Zero-overhead HTML, CSS & GSAP animations rendered to frame-accurate MP4
        </p>

        <div class="tags">
          <div id="tag1" class="tag">⚡ 1080×1920 9:16</div>
          <div id="tag2" class="tag">🎬 Headless Chrome</div>
          <div id="tag3" class="tag">🚀 FFmpeg</div>
        </div>
      </div>

      <div class="clip progress-container" data-start="0" data-duration="4" data-track-index="1">
        <div id="bar" class="progress-bar"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Animate progress bar linearly over 4 seconds
      tl.to("#bar", { width: "100%", duration: 4, ease: "none" }, 0);

      // Frame 0 shows badge & title partially so thumbnail is engaging
      tl.fromTo(
        "#badge",
        { opacity: 0.7, scale: 0.95 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" },
        0
      );

      // Headline entrance starts right from t=0
      tl.fromTo(
        "#title",
        { opacity: 0.6, y: 30, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      // Description entrance
      tl.fromTo(
        "#desc",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        0.5
      );

      // Stagger tags
      tl.fromTo(
        ["#tag1", "#tag2", "#tag3"],
        { opacity: 0, y: 30, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, stagger: 0.15, ease: "back.out(1.5)" },
        0.9
      );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
